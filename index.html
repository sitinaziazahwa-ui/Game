<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Game</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c0f25, #1f275a);
            height: 100vh;
            color: white;
            overflow-x: hidden;
            background-size: 200% 200%;
            animation: bgMove 10s ease-in-out infinite;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-align: center;
            margin-top: 25px;
            font-size: 40px;
            letter-spacing: 2px;
            color: #4adfff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #4adfff; }
            to   { text-shadow: 0 0 20px #4adfff; }
        }

        .arena {
            display: flex;
            justify-content: space-around;
            margin-top: 50px;
            gap: 30px;
            padding: 0 40px;
        }

        .card {
            width: 40%;
            padding: 25px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 25px rgba(0,255,255,0.25);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.7s ease-out;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(0,255,255,0.4);
        }

        .card.player2 {
            animation-delay: 0.15s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .energy-wrapper {
            margin-top: 10px;
        }

        .energy-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .energy-bar {
            height: 22px;
            width: 100%;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00fdb5, #00bfff);
            border-radius: 20px;
            transition: width 0.4s ease, transform 0.2s ease;
            box-shadow: 0 0 20px #00e7c9;
        }

        .energy-fill.heal {
            animation: pulse 0.3s ease-out;
        }

        .energy-fill.hit {
            animation: flashRed 0.3s ease-out;
        }

        @keyframes pulse {
            0% { transform: scaleX(1); }
            50% { transform: scaleX(1.05); }
            100% { transform: scaleX(1); }
        }

        @keyframes flashRed {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(-80deg) brightness(1.4); }
            100% { filter: hue-rotate(0deg); }
        }

        button {
            padding: 12px 22px;
            margin: 12px 5px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            border-radius: 10px;
            font-weight: bold;
            color: #fff;
            transition: 0.25s;
        }

        .btn-eat {
            background: #00c853;
        }

        .btn-eat:hover { background: #00e676; transform: scale(1.07); }

        .btn-attack {
            background: #d50000;
        }

        .btn-attack:hover { background: #ff1744; transform: scale(1.07); }

        .card-hit {
            animation: shake 0.35s ease-out;
        }

        .card-heal {
            animation: gentleUp 0.35s ease-out;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }

        @keyframes gentleUp {
            0% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        /* Log */
        #log {
            text-align: center;
            margin-top: 40px;
            font-size: 20px;
            opacity: 0.9;
            transition: 0.3s;
        }

        /* Animation */
        .log-animate {
            transform: scale(1.12);
            color: #4adfff;
        }

        /* Inventori */
        .inventori-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .inventori-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .inventori-group h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #4adfff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-list::-webkit-scrollbar {
            width: 6px;
        }

        .item-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .item-list::-webkit-scrollbar-thumb {
            background: rgba(74, 223, 255, 0.5);
            border-radius: 10px;
        }

        .item-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .item-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(3px);
        }

        .item-emoji {
            font-size: 20px;
        }

        .item-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        .item-stat {
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(74, 223, 255, 0.2);
        }

        .item-card.senjata .item-stat {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
        }

        .item-card.makanan .item-stat {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.2);
        }

        .btn-use {
            padding: 6px 12px;
            font-size: 11px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-use:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .empty-inventori {
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
            padding: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>⚔ BATTLE ARENA ⚔</h1>

    <div class="arena">

        <div class="card" id="card1">
            <h2>Pemain 1: <span id="nama1"></span></h2>
            <h3>Energi: <span id="energi1"></span></h3>

            <div class="energy-wrapper">
                <div class="energy-bar">
                    <div id="bar1" class="energy-fill"></div>
                </div>
            </div>

            <button class="btn-eat" onclick="p1Makan()">🍗 Makan</button>
            <button class="btn-attack" onclick="p1Serang()">⚔ Diserang</button>

            <div id="inventori1" class="inventori-container"></div>
        </div>

        <div class="card player2" id="card2">
            <h2>Pemain 2: <span id="nama2"></span></h2>
            <h3>Energi: <span id="energi2"></span></h3>

            <div class="energy-wrapper">
                <div class="energy-bar">
                    <div id="bar2" class="energy-fill"></div>
                </div>
            </div>

            <button class="btn-eat" onclick="p2Makan()">🍗 Makan</button>
            <button class="btn-attack" onclick="p2Serang()">⚔ Diserang</button>

            <div id="inventori2" class="inventori-container"></div>
        </div>

    </div>

    <h2 id="log">Selamat datang di arena!</h2>

    <script src="game.js"></script>
</body>
</html>
